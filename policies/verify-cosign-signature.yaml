# verify-cosign-signature.yaml
#
# No es una de las 3 politicas "obligatorias" del PDF, pero SI es lo que
# exige el enunciado por separado: "firma de imagenes con Cosign y
# verificacion de la firma antes del despliegue". El workflow de P8 ya
# verifica la firma en CI (paso "Verificar la firma" del job
# docker-security) -- esta politica hace la MISMA verificacion, pero en
# el cluster, al momento de admitir el pod. Es la diferencia entre
# "lo comprobamos una vez en el pipeline" y "el cluster mismo se niega a
# correr una imagen no firmada", que es justo la debilidad que P8
# identifica en P7 ("ninguna imagen podra llegar al cluster sin haber
# sido... verificada").
#
# keyless: verifica contra el certificado de identidad de Sigstore/Fulcio
# emitido para ESTE repositorio de GitHub Actions especificamente -- no
# cualquier imagen firmada con cualquier identidad, solo las firmadas por
# el propio workflow de P8 de este repo.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-cosign-signature
  annotations:
    policies.kyverno.io/title: Verify Cosign Signature
    policies.kyverno.io/category: Practica 8 - Cadena de suministro
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Ninguna imagen de ghcr.io/jencer737/sa-p8-* puede desplegarse en
      sa-p8 sin una firma Cosign valida, emitida por el workflow de
      GitHub Actions de este repositorio.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature-sa-p8-images
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["sa-p8"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/jencer737/sa-p8-*"
          attestors:
            - entries:
                - keyless:
                    subjectRegExp: "https://github.com/Jencer737/Practicas-SA-B-202002141/.*"
                    issuer: "https://token.actions.githubusercontent.com"
