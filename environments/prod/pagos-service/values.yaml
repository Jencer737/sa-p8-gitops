# values.yaml -- pagos-service / prod

image:
  repository: ghcr.io/jencer737/sa-p8-pagos-service
  tag: "p10-v1.0.0"

service:
  port: 4004

probes:
  path: /health

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }

envFromSealedSecret: pagos-service-secrets
