# values.yaml -- productos-service / prod

image:
  repository: ghcr.io/jencer737/sa-p8-productos-service
  tag: "0.1.0"

service:
  port: 4002

probes:
  path: /health

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }

envFromSealedSecret: productos-service-secrets
