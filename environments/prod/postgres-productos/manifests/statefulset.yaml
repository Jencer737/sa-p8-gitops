# StatefulSet propio con la imagen oficial de postgres (docker.io/library,
# no bitnami): el registro gratuito de bitnami/postgresql en Docker Hub
# solo deja "latest" disponible desde 2025 (todo tag versionado quedo
# detras de su paywall de "Secure Images"), lo cual choca directo con
# nuestra propia politica disallow-latest-tag. La imagen oficial de
# postgres SI sigue publicando tags versionados y estables de forma
# gratuita e indefinida -- una dependencia externa mas confiable para
# una practica que trata justamente de reducir puntos unicos de fallo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-productos
  namespace: sa-p8
  labels:
    app.kubernetes.io/name: postgres-productos
spec:
  serviceName: postgres-productos
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-productos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-productos
      annotations:
        # Velero (modo opt-in): respalda SOLO el volumen "data" -- el
        # unico con estado. Sin esto, con defaultVolumesToFsBackup se
        # respaldaban tambien los emptyDir "tmp" de los 10 pods sin
        # estado, sin ningun valor de recuperacion.
        backup.velero.io/backup-volumes: data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: productos
            - name: POSTGRES_USER
              value: productos
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-productos-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "productos", "-d", "productos"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "productos", "-d", "productos"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: initdb
          configMap:
            name: postgres-productos-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 2Gi
