# values.yaml — postgres-productos (chart bitnami/postgresql)
#
# Contraseña de la base: NO va aquí en texto plano. Se inyecta via
# `auth.existingSecret` apuntando a un SealedSecret (ver
# GENERAR-SEALED-SECRETS.md) con la misma llave que ya usan
# JWT_SECRET/AES_SECRET/DATABASE_URL en los demás servicios.

fullnameOverride: postgres-productos

auth:
  existingSecret: postgres-productos-credentials
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password
  username: productos
  database: productos

primary:
  persistence:
    enabled: true
    size: 2Gi
    storageClass: standard-rwo

  # Requisito del PDF ("servicio con estado... con datos verificables"):
  # se siembra el mismo esquema y las mismas 3 filas que
  # P4/productos-service/db/init.sql, para que la prueba de restauración
  # tenga contenido real que comparar antes/después.
  initdb:
    scripts:
      init.sql: |
        CREATE TABLE IF NOT EXISTS productos (
          id UUID PRIMARY KEY,
          nombre TEXT NOT NULL,
          precio NUMERIC(12, 2) NOT NULL,
          stock INTEGER NOT NULL,
          categoria TEXT NOT NULL
        );

        INSERT INTO productos (id, nombre, precio, stock, categoria) VALUES
          (gen_random_uuid(), 'Teclado mecánico', 350, 20, 'Periféricos'),
          (gen_random_uuid(), 'Mouse inalámbrico', 150, 35, 'Periféricos'),
          (gen_random_uuid(), 'Monitor 24"', 1200, 10, 'Monitores')
        ON CONFLICT DO NOTHING;

  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

  # Sin PDB/anti-afinidad a propósito: la prueba de "pérdida de nodo" del
  # PDF la demuestra un microservicio SIN estado con 2+ réplicas (ver
  # environments/prod/auth-service/values.yaml), no una base de datos de
  # una sola réplica -- eso sería alta disponibilidad de la BD, que el
  # PDF no pide y añadiría complejidad de replicación fuera de alcance.

volumePermissions:
  enabled: true
