apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: productos-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  project: default
  sources:
    - repoURL: https://github.com/Jencer737/sa-p8-gitops.git
      targetRevision: main
      path: charts/microservice
      helm:
        valueFiles:
          - $values/environments/prod/productos-service/values.yaml
    - repoURL: https://github.com/Jencer737/sa-p8-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
