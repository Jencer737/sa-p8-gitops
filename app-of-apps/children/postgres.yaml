# Base de datos con volumen persistente dentro del cluster (requisito
# explicito del PDF). StatefulSet propio con la imagen oficial de
# postgres (ver manifests/statefulset.yaml para la justificacion
# completa de por que se abandono el chart de Bitnami: su registro
# gratuito de Docker Hub dejo de publicar tags versionados en 2025,
# solo ":latest" -- que ademas viola nuestra propia politica
# disallow-latest-tag).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-productos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  project: default
  sources:
    - repoURL: https://github.com/Jencer737/sa-p8-gitops
      targetRevision: main
      path: environments/prod/postgres-productos/manifests
    - repoURL: https://github.com/Jencer737/sa-p8-gitops
      targetRevision: main
      path: environments/prod/postgres-productos/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
