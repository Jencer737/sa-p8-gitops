# P9: en P7/P8 el ghcr-pull-secret (necesario para que los 10 pods
# puedan descargar imagenes privadas de GHCR) se creaba a mano con
# "kubectl create secret docker-registry" -- el ultimo paso manual real
# que quedaba en el bootstrap. Se sincroniza aqui como un SealedSecret
# mas, wave -2 (antes de los microservicios, wave 0), igual que
# sealed-secrets/argo-rollouts/kyverno/velero.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghcr-pull-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  source:
    repoURL: https://github.com/Jencer737/sa-p8-gitops
    targetRevision: main
    path: environments/prod/ghcr-pull-secret/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
