# Reemplaza el "helm install kyverno" manual de P8. Las 4 ClusterPolicy
# de P8 (disallow-latest-tag, require-resource-limits, require-non-root,
# verify-cosign-signature) se agregan como una Application aparte
# (kyverno-policies.yaml) en el siguiente sync-wave, para que el
# controlador de Kyverno ya este listo cuando se apliquen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.6
    helm:
      releaseName: kyverno
      # Los hooks internos del chart (limpieza de PolicyReports tras
      # instalar, limpieza de webhooks antes de desinstalar -- esto
      # ultimo importa para "terraform destroy" en la prueba de DR)
      # usan bitnami/kubectl:1.30.2 por defecto, tag que ya no existe
      # gratis (mismo problema recurrente de Bitnami en esta practica).
      # Aqui no hace falta copiar binarios entre contenedores (como en
      # el job de Velero), asi que cualquier imagen versionada con
      # kubectl sirve.
      values: |
        policyReportsCleanup:
          image:
            repository: rancher/kubectl
            tag: v1.35.0
        webhooksCleanup:
          image:
            repository: rancher/kubectl
            tag: v1.35.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
