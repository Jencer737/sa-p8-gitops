# Reemplaza el "helm install kyverno" manual de P8. Las 4 ClusterPolicy
# de P8 (disallow-latest-tag, require-resource-limits, require-non-root,
# verify-cosign-signature) se agregan como una Application aparte
# (kyverno-policies.yaml) en el siguiente sync-wave, para que el
# controlador de Kyverno ya este listo cuando se apliquen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.3.6
    helm:
      releaseName: kyverno
      # Los hooks de limpieza del chart (policyReportsCleanup: tras un
      # *upgrade*; webhooksCleanup: antes de *desinstalar* el chart) usan
      # bitnami/kubectl:1.30.2 por defecto -- tag que ya no existe gratis
      # (mismo problema recurrente de Bitnami). El reemplazo rancher/kubectl
      # no trae shell y el hook fallaba con StartError en cada
      # reconstruccion. Ninguno aporta aqui: no hay upgrades (cada
      # reconstruccion es una instalacion nueva) y Kyverno nunca se
      # desinstala por separado: el cluster completo se destruye.
      values: |
        policyReportsCleanup:
          enabled: false
        webhooksCleanup:
          enabled: false
        # config.preserve=true (defecto) crea un hook "post-delete" que
        # conserva un ConfigMap al desinstalar. ArgoCD agrega entonces a la
        # Application el finalizer post-delete-finalizer.argocd.argoproj.io,
        # que solo el controlador de ArgoCD puede retirar; al destruir el
        # cluster (Terraform desinstala ArgoCD antes de borrar el namespace)
        # nadie lo procesa y el namespace "argocd" queda en Terminating hasta
        # el timeout -- descubierto en la 1a y 2a prueba de DR. Sin ese hook
        # no hay finalizer.
        config:
          preserve: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
