# Reemplaza el "helm install sealed-secrets" manual de P8.
# Sync-wave mas temprano de todos: los SealedSecret de cada
# microservicio (envFrom secretRef) necesitan que el controlador ya
# tenga la llave privada cargada (restaurada por
# scripts/restore-sealed-secrets-key.sh ANTES de este sync, ver
# P9/docs/RUNBOOK.md) para poder descifrarlos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.16.1
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
