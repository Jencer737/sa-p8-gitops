# Instala el controlador de Velero, con el BackupStorageLocation
# apuntando al bucket del stack "persistent" y el Schedule programado
# definidos directamente en los values del chart oficial (que soporta
# ambos nativamente) -- no hace falta una Application ni un CRD aparte.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 8.1.0
      helm:
        releaseName: velero
        # credentials-velero: SealedSecret con la clave de la Service
        # Account de GCP que Velero usa para escribir en el bucket -- ver
        # GENERAR-SEALED-SECRETS.md seccion "cloud-credentials". El
        # bucket se inyecta aqui via values, no esta hardcodeado en el
        # chart.
        values: |
          # El job "upgrade-crds" (kubectl.image) resulto ser un callejon
          # sin salida: necesita copiar binarios "sh"/"kubectl" al
          # contenedor principal de Velero via un volumen compartido, y
          # cada alternativa libre probada fallo por una razon distinta
          # (bitnami sin tags libres, rancher sin shell, alpine con
          # incompatibilidad musl/glibc, cloud-sdk con una version de
          # GLIBC mas nueva que la que soporta el binario "sh" copiado).
          # La solucion real: el chart ya trae las CRDs en su carpeta
          # crds/ de Helm, que se instala automaticamente en cualquier
          # instalacion nueva -- exactamente nuestro caso, ya que cada
          # reconstruccion de P9 arranca de cero. El job de "upgrade" solo
          # hace falta para actualizar CRDs de un Velero YA instalado a
          # una version distinta, algo que nunca nos pasa aqui.
          upgradeCRDs: false
          initContainers:
            - name: velero-plugin-for-gcp
              image: velero/velero-plugin-for-gcp:v1.11.1
              volumeMounts:
                - mountPath: /target
                  name: plugins
          # Respaldo del CONTENIDO de los volumenes por sistema de archivos
          # (Kopia, via el daemonset node-agent) en vez de snapshots de
          # disco de GCP: solo necesita acceso al bucket (que la Service
          # Account ya tiene), no permisos de compute.snapshots, y los
          # datos quedan en el bucket externo al cluster, no como
          # snapshots dentro del mismo proyecto. Sin node-agent, un
          # backup "con volumenes" solo guardaba los objetos de
          # Kubernetes (el PVC vacio), no los datos -- descubierto al
          # revisar la configuracion antes de la primera prueba real de
          # restauracion.
          deployNodeAgent: true
          snapshotsEnabled: false
          nodeAgent:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
          configuration:
            backupStorageLocation:
              - name: default
                provider: gcp
                bucket: "sa-p9-velero-202002141" # output velero_bucket_name del stack persistent
          credentials:
            existingSecret: cloud-credentials
          # Respaldo diario, con volumenes persistentes incluidos (el
          # requisito explicito del PDF) y 14 dias de retencion -- igual
          # al lifecycle rule del bucket en el stack persistent, asi el
          # objeto nunca sobrevive en el bucket mas de lo que Velero cree
          # que debe.
          schedules:
            daily-backup:
              disabled: false
              schedule: "0 3 * * *"
              useOwnerReferencesInBackup: false
              template:
                ttl: "336h0m0s" # 14 dias
                includedNamespaces:
                  - sa-p8
                snapshotVolumes: false
                # modo opt-in: solo los volumenes anotados con
                # backup.velero.io/backup-volumes (el 'data' de Postgres)
                defaultVolumesToFsBackup: false
    # P9: sincroniza el SealedSecret cloud-credentials (ver
    # auth-service.yaml para la nota completa de por que esto reemplaza
    # el kubectl apply manual de P8).
    - repoURL: https://github.com/Jencer737/sa-p8-gitops
      targetRevision: main
      path: environments/prod/velero/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
