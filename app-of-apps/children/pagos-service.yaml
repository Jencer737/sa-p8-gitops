apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pagos-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  project: default
  sources:
    - repoURL: https://github.com/Jencer737/sa-p8-gitops.git
      targetRevision: main
      path: charts/microservice
      helm:
        valueFiles:
          - $values/environments/prod/pagos-service/values.yaml
    - repoURL: https://github.com/Jencer737/sa-p8-gitops.git
      targetRevision: main
      ref: values
    # P9: sincroniza el SealedSecret (ver auth-service.yaml para la nota
    # completa de por que esto reemplaza el kubectl apply manual de P8).
    - repoURL: https://github.com/Jencer737/sa-p8-gitops.git
      targetRevision: main
      path: environments/prod/pagos-service/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
