# Copia del ghcr-pull-secret, pero en el namespace "kyverno" (no
# "sa-p8"). Kyverno exige que las credenciales que usa para verificar
# firmas de imagenes en registries privados vivan en SU PROPIO
# namespace -- ver policies/verify-cosign-signature.yaml
# (imageRegistryCredentials.secrets).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghcr-pull-secret-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: sa-platform-infra
spec:
  project: default
  source:
    repoURL: https://github.com/Jencer737/sa-p8-gitops
    targetRevision: main
    path: environments/prod/ghcr-pull-secret-kyverno/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
