# P10: almacen de registros. Modo SingleBinary con disco local: un solo
# pod, suficiente para el volumen de esta practica (5 servicios, unas
# pocas lineas por segundo) y sin depender de un bucket.
#
# Los registros llegan por OTLP (endpoint /otlp de Loki 3) desde el
# DaemonSet otel-agent, que los lee de /var/log/pods de cada nodo. El
# cuerpo de cada linea es el JSON que escribe el servicio, consultable
# por campo con "| json" (ej. {service_name="ordenes-service"} | json |
# level="error").
#
# Se apagan las piezas del chart pensadas para produccion a escala
# (caches memcached de varios GiB, canary de Loki, gateway nginx,
# componentes read/write/backend).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: sa-observabilidad
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.2.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            retention_period: 72h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false
          ruler:
            enable_api: false
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 5Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
