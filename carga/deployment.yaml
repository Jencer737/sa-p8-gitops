# Generador de trafico (k6). El script es P10/carga/trafico-usuarios.js
# del repo de codigo, copiado al ConfigMap por P10/scripts/sincronizar-gitops.sh.
# ~2 iteraciones/s: 55% catalogo, 30% detalle de producto, 15% compra
# (orden + pago).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generador-trafico
  namespace: carga
  labels:
    app.kubernetes.io/name: generador-trafico
    app.kubernetes.io/part-of: sa-observabilidad
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generador-trafico
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generador-trafico
      annotations:
        # reinicia k6 cuando cambia el script
        script-version: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "--quiet", "/carga/trafico-usuarios.js"]
          env:
            - name: BASE_URL
              value: http://api-gateway.sa-p8.svc.cluster.local:4000
            - name: RATE
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /carga, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: script
          configMap:
            name: trafico-usuarios
        - { name: tmp, emptyDir: {} }
