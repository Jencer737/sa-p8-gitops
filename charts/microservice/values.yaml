# values.yaml
#
# Valores por defecto del chart "microservice". Cada servicio real los
# sobre-escribe con environments/<ambiente>/<servicio>/values.yaml -- ver
# ese archivo para la lista completa de overrides por servicio.

nameOverride: ""

replicaCount: 2

image:
  repository: ""     # obligatorio, lo pone cada values de servicio (ghcr.io/.../sa-p8-<servicio>)
  tag: ""             # obligatorio -- el pipeline de P8 lo actualiza via PR automatico, NUNCA "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

namespace: sa-p8

service:
  port: 4000
  type: ClusterIP   # solo api-gateway lo sobre-escribe a LoadBalancer

logLevel: info

# Variables de entorno adicionales especificas del servicio (ej. URLs de
# los otros microservicios, nombre de schema de base de datos). Lista de
# {name, value} u {name, valueFrom}.
extraEnv: []

envFromSealedSecret: ""   # nombre del Secret (ya desellado) con credenciales sensibles, si aplica

# P10: el SDK de OpenTelemetry suma memoria (~40-60 MiB por proceso); con
# el limite anterior de 128Mi los pods quedaban al borde del OOMKill.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }

# --- Observabilidad (P10) -----------------------------------------------
otel:
  endpoint: http://otel-collector.observability.svc.cluster.local:4318
  metricExportIntervalMs: 10000

probes:
  path: /health
  startup: { failureThreshold: 30, periodSeconds: 2 }
  readiness: { initialDelaySeconds: 5, periodSeconds: 10 }
  liveness: { initialDelaySeconds: 15, periodSeconds: 20 }

# --- Entrega progresiva (Argo Rollouts) ---------------------------------
canary:
  # 3 pasos de promocion. Antes de cada analisis hay una pausa: la
  # candidata necesita recibir trafico real (y Prometheus ver al menos
  # dos muestras) antes de que haya algo que medir.
  steps:
    - setWeight: 25
    - pauseSeconds: 60
    - analysis: true
    - setWeight: 50
    - pauseSeconds: 30
    - analysis: true
    - setWeight: 100
  analysis:
    # P10: el analisis consulta Prometheus (ver analysistemplate.yaml y la
    # justificacion de los umbrales en P10/docs/DOCUMENTACION.md).
    prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    # 4 mediciones, una cada 30s (~1m30s por paso). Fallan 2 -> se aborta
    # (failureLimit 1 tolera un pico aislado sin revertir por ruido).
    interval: 30s
    count: 4
    failureLimit: 1
    # Una medicion sin trafico se tolera; dos -> Inconclusive (pausa).
    inconclusiveLimit: 1
    # Tasa de error maxima de la candidata (5xx / total, ventana de 1m).
    maxErrorRate: 0.05
    # p95 maximo de la candidata, en segundos. Generico; productos-service
    # lo baja a 0.3 (el umbral de su SLO de latencia).
    maxP95Seconds: 1.0

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# --- Resiliencia ante perdida de nodo (P9) ------------------------------
# Activo por defecto para los 5 servicios: con replicaCount=2 y
# minAvailable=1, un drenaje de nodo solo puede desalojar un pod a la vez
# y debe esperar a que el otro siga listo, asi el Service nunca se queda
# sin endpoints durante la prueba.
pdb:
  enabled: true
  minAvailable: 1

antiAffinity:
  enabled: true
