# analysistemplate.yaml (P10)
#
# Puerta de calidad de cada paso del canary, GOBERNADA POR METRICAS
# REALES: ya no corre ningun Job de pruebas (el smoke test de P8). Le
# pregunta a Prometheus como se esta comportando la version candidata con
# el trafico que de verdad le esta llegando.
#
# Como se aisla a la candidata: cada pod exporta sus metricas con el
# atributo rollout.pod_template_hash (inyectado por el Rollout desde la
# etiqueta rollouts-pod-template-hash, ver rollout.yaml). El paso de
# analisis le pasa a esta plantilla el hash de la revision MAS NUEVA
# (podTemplateHashValue: Latest), asi que las consultas solo ven los pods
# candidatos aunque el Service publico reparta trafico entre ambas
# versiones.
#
# Tres resultados posibles por medicion:
#  - Successful: hay trafico y tasa de error y p95 estan dentro del umbral.
#  - Failed: tasa de error o p95 por encima del umbral -> aborta y revierte.
#  - Inconclusive: no hubo trafico sobre la candidata (la consulta
#    devuelve -1 o NaN). Sin evidencia no se promueve ni se revierte: el
#    Rollout se pausa y decide una persona.
#
# NOTA: la sintaxis {{`{{args.x}}`}} es de Argo Rollouts, no de Helm; va
# entre backticks para que Helm la deje pasar tal cual.

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "microservice.name" . }}-analisis-metricas
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
    - name: canary-hash
  metrics:
    # Proporcion de respuestas 5xx (o abandonadas, 499) de la candidata en
    # el ultimo minuto.
    - name: tasa-de-error
      interval: {{ .Values.canary.analysis.interval }}
      count: {{ .Values.canary.analysis.count }}
      failureLimit: {{ .Values.canary.analysis.failureLimit }}
      inconclusiveLimit: {{ .Values.canary.analysis.inconclusiveLimit }}
      successCondition: "result[0] >= 0 && result[0] <= {{ .Values.canary.analysis.maxErrorRate }}"
      failureCondition: "result[0] > {{ .Values.canary.analysis.maxErrorRate }}"
      provider:
        prometheus:
          address: {{ .Values.canary.analysis.prometheusAddress }}
          query: |
            (
              (sum(rate(sa_http_server_requests_total{service_name="{{`{{args.service-name}}`}}", rollout_pod_template_hash="{{`{{args.canary-hash}}`}}", status_code=~"5..|499"}[1m])) or on() vector(0))
              /
              sum(rate(sa_http_server_requests_total{service_name="{{`{{args.service-name}}`}}", rollout_pod_template_hash="{{`{{args.canary-hash}}`}}"}[1m]))
            ) or on() vector(-1)
    # Percentil 95 de la latencia de la candidata, en segundos.
    - name: latencia-p95
      interval: {{ .Values.canary.analysis.interval }}
      count: {{ .Values.canary.analysis.count }}
      failureLimit: {{ .Values.canary.analysis.failureLimit }}
      inconclusiveLimit: {{ .Values.canary.analysis.inconclusiveLimit }}
      successCondition: "result[0] >= 0 && result[0] <= {{ .Values.canary.analysis.maxP95Seconds }}"
      failureCondition: "result[0] > {{ .Values.canary.analysis.maxP95Seconds }}"
      provider:
        prometheus:
          address: {{ .Values.canary.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(sa_http_server_request_duration_seconds_bucket{service_name="{{`{{args.service-name}}`}}", rollout_pod_template_hash="{{`{{args.canary-hash}}`}}"}[1m]))
            ) or on() vector(-1)
