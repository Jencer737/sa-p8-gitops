apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.name" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  {{- range .Values.extraEnv }}
  {{- if .value }}
  {{ .name }}: {{ .value | quote }}
  {{- end }}
  {{- end }}
