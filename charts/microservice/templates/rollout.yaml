apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "microservice.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "microservice.name" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.antiAffinity.enabled }}
      # "preferred" (blando) y no "required": con 2 nodos y 5 servicios a
      # 2 replicas cada uno, una regla dura podria dejar pods en Pending
      # si el scheduler no encuentra suficiente espacio en un segundo
      # nodo. La prueba de perdida de nodo (P9/docs/RUNBOOK.md) verifica
      # la ubicacion real antes de drenar, no confia ciegamente en esto.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "microservice.selectorLabels" . | nindent 20 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: {{ include "microservice.name" . }}
          image: "{{ required "image.repository es requerido" .Values.image.repository }}:{{ required "image.tag es requerido (nunca 'latest')" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "microservice.name" . }}-config
            {{- if .Values.envFromSealedSecret }}
            - secretRef:
                name: {{ .Values.envFromSealedSecret }}
            {{- end }}
          env:
            # --- P10: OpenTelemetry ------------------------------------
            # El hash de plantilla que Argo Rollouts pone en cada pod viaja
            # como atributo de recurso de toda la telemetria: es lo que deja
            # al AnalysisTemplate medir SOLO a la version candidata.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: ROLLOUT_POD_TEMPLATE_HASH
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['rollouts-pod-template-hash']" } }
            - name: OTEL_SERVICE_NAME
              value: {{ include "microservice.name" . | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version={{ .Values.image.tag }},k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),rollout.pod_template_hash=$(ROLLOUT_POD_TEMPLATE_HASH)"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.otel.metricExportIntervalMs | quote }}
            {{- range .Values.extraEnv }}
            {{- if .valueFrom }}
            - name: {{ .name }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: {{ .Values.service.port }} }
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.path }}, port: {{ .Values.service.port }} }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
  # Sin esto, si un pod candidato nunca llega a estar Ready (ej. su propio
  # readinessProbe falla), Argo Rollouts se queda "Degraded" indefinidamente
  # esperando intervencion manual -- NO revierte solo. progressDeadlineAbort
  # es lo que hace que, pasado ese tiempo sin progreso, el propio Rollout
  # aborte y regrese el 100% del trafico a la version estable de forma
  # automatica (justo el requisito de "reversion automatica" del PDF).
  progressDeadlineSeconds: 120
  progressDeadlineAbort: true
  strategy:
    canary:
      canaryService: {{ include "microservice.name" . }}-canary
      stableService: {{ include "microservice.name" . }}-stable
      steps:
        {{- range .Values.canary.steps }}
        {{- if hasKey . "setWeight" }}
        - setWeight: {{ .setWeight }}
        {{- else if hasKey . "pauseSeconds" }}
        - pause: { duration: {{ .pauseSeconds }}s }
        {{- else if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ include "microservice.name" $ }}-analisis-metricas
            args:
              - name: service-name
                value: {{ include "microservice.name" $ }}
              # hash de la revision mas nueva = la version candidata
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
        {{- end }}
